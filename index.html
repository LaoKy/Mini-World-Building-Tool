def minecraft_name_to_miniworld_id(mc_name: str) -> int | None:
    """
    Chuyển đổi tên block Minecraft (có hoặc không có namespace)
    sang ID Mini World. Trả về None nếu là block rỗng (air).
    """
    name = mc_name.strip().lower()

    # Chuẩn hoá namespace
    if ':' not in name:
        name = "minecraft:" + name

    # Tra cứu trực tiếp
    if name in BLOCK_MAP:
        return BLOCK_MAP[name]

    # Fallback: bỏ namespace rồi tìm lại
    bare = name.split(':', 1)[1]
    full_fallback = "minecraft:" + bare
    if full_fallback in BLOCK_MAP:
        return BLOCK_MAP[full_fallback]

    # Không tìm thấy → dùng mặc định
    print(f"  [MAP?] Không tìm thấy: {name} → dùng id mặc định {DEFAULT_ID}")
    return DEFAULT_ID


# ══════════════════════════════════════════════════════════════════════════════
#  2. LOGIC HƯỚNG (DIRECTION)
# ══════════════════════════════════════════════════════════════════════════════

FACING_TO_DIRECTION = {
    "north": 3,
    "east": 0,
    "south": 2,
    "west": 1,
    "down": 4, # Hướng xuống
    "up": 5,   # Hướng lên
}

# SỬA LỖI Ở ĐÂY: Trục Y (trên/xuống) của Mini World thường có data là 0
AXIS_TO_DIRECTION = {
    "x": 1, # Nằm ngang trục X
    "y": 0, # Hướng đứng (trên/xuống) 
    "z": 2, # Nằm ngang trục Z
}

def parse_block_state(block_state_str: str) -> tuple[str, dict]:
    """
    Phân tích chuỗi block state:
    "minecraft:oak_stairs[facing=north,half=bottom]" → ("minecraft:oak_stairs", {"facing":"north",...})
    """
    match = re.match(r'^([^\[]+)(?:\[([^\]]*)\])?$', block_state_str.strip())
    if not match:
        return block_state_str.strip(), {}

    base_name = match.group(1).strip()
    props_str = match.group(2) or ""
    props = {}
    if props_str:
        for part in props_str.split(','):
            if '=' in part:
                k, v = part.split('=', 1)
                props[k.strip()] = v.strip()
    return base_name, props


def get_direction(props: dict) -> int:
    """Chuyển đổi properties Minecraft → direction Mini World."""
    dir_val = 0
    
    # 1. Xử lý block có hướng mặt (facing)
    if "facing" in props:
        dir_val = FACING_TO_DIRECTION.get(props["facing"].lower(), 0)
    
    # 2. Xử lý block dạng cột/trục (axis) như thân gỗ, cột thạch anh
    elif "axis" in props:
        return AXIS_TO_DIRECTION.get(props["axis"].lower(), 0)
        
    # 3. SỬA LỖI Ở ĐÂY: Xử lý cầu thang/phiến đá lật ngược (nửa trên)
    # Trong Mini World, các block lật ngược thường cộng thêm 4 (hoặc 8 tùy block) vào data
    if "half" in props and props["half"] == "top":
        dir_val += 4
    elif "type" in props and props["type"] == "top": # Dành cho Slab (Phiến đá)
        dir_val += 4
        
    return dir_val

# ══════════════════════════════════════════════════════════════════════════════
#  3. MINECRAFT LEGACY DATA VALUE → DIRECTION (cho .schematic cũ)
# ══════════════════════════════════════════════════════════════════════════════

def legacy_data_to_direction(block_id: int, data_value: int) -> int:
    """Chuyển đổi metadata Minecraft (.schematic cũ) → direction Mini World."""
    # Logs (block_id 17): bits 2-3 là trục
    if block_id == 17:
        axis = (data_value >> 2) & 0x3
        return [1, 5, 3, 0][axis % 4]
    # Stairs
    STAIR_IDS = {53,67,108,109,114,128,134,135,136,163,164,180,203}
    if block_id in STAIR_IDS:
        return {0: 5, 1: 4, 2: 3, 3: 2}.get(data_value & 0x3, 0)
    # Doors
    DOOR_IDS = {64, 71, 193, 194, 195, 196, 197}
    if block_id in DOOR_IDS:
        return {0: 3, 1: 4, 2: 2, 3: 5}.get(data_value & 0x3, 0)
    # Furnace, Dispenser
    if block_id in {23, 61, 62, 158}:
        return {2: 3, 3: 2, 4: 4, 5: 5}.get(data_value & 0x7, 0)
    return 0

#  4. ĐỌC FILE NBT – DEEP SCAN ĐỆ QUY
# ══════════════════════════════════════════════════════════════════════════════

def deep_scan(nbt_data, target_key: str):
    """Tìm kiếm đệ quy trong cây NBT. Trả về giá trị đầu tiên tìm thấy."""
    if isinstance(nbt_data, (dict, nbtlib.Compound)):
        for key, value in nbt_data.items():
            if key == target_key:
                return value
            result = deep_scan(value, target_key)
            if result is not None:
                return result
    elif isinstance(nbt_data, (list, nbtlib.List)):
        for item in nbt_data:
            result = deep_scan(item, target_key)
            if result is not None:
                return result
    return None


def decode_varint_array(data: bytes) -> list[int]:
    """Giải mã mảng VarInt từ bytes (SpongeSchematic v2/v3)."""
    result = []
    i = 0
    while i < len(data):
        value = 0
        shift = 0
        while True:
            if i >= len(data):
                break
            byte = data[i]
            i += 1
            value |= (byte & 0x7F) << shift
            shift += 7
            if not (byte & 0x80):
                break
        if value & 1:
            value = -(value >> 1) - 1
        else:
            value = value >> 1
        result.append(value)
    return result

#  5. PARSER CHO TỪNG ĐỊNH DẠNG FILE

class BlockEntry:
    """Đại diện cho một khối trong công trình."""
    __slots__ = ('x', 'y', 'z', 'miniworld_id', 'direction')

    def __init__(self, x: int, y: int, z: int, miniworld_id: int, direction: int = 0):
        self.x = x
        self.y = y
        self.z = z
        self.miniworld_id = miniworld_id
        self.direction = direction

    def __repr__(self):
        return f"Block({self.x},{self.y},{self.z}) id={self.miniworld_id} dir={self.direction}"


def _dump_nbt_keys(nbt_data, prefix="", depth=0, max_depth=4):
    """In cấu trúc NBT để debug."""
    if depth > max_depth:
        return
    if isinstance(nbt_data, (dict, nbtlib.Compound)):
        for key, value in nbt_data.items():
            vtype = type(value).__name__
            print(f"[DEBUG]  {'  '*depth}{prefix}{key}  ({vtype})")
            _dump_nbt_keys(value, "", depth+1, max_depth)
    elif isinstance(nbt_data, (list, nbtlib.List)):
        print(f"[DEBUG]  {'  '*depth}[list len={len(nbt_data)}]")


def _extract_palette_and_data(nbt_file):
    """
    Trích xuất Palette và BlockData từ file SpongeSchematic (v1/v2/v3).
    Trả về (palette_tag, block_data_tag, width, height, length)
    """
    w = deep_scan(nbt_file, "Width")
    h = deep_scan(nbt_file, "Height")
    l = deep_scan(nbt_file, "Length")
    palette = deep_scan(nbt_file, "Palette")
    blockdata = deep_scan(nbt_file, "BlockData")
    if w and h and l and palette is not None and blockdata is not None:
        print("[INFO] Định dạng: SpongeSchematic v2")
        return palette, blockdata, int(w), int(h), int(l)

    root = nbt_file
    if "Schematic" in nbt_file:
        root = nbt_file["Schematic"]
        print("[INFO] Tìm thấy thẻ 'Schematic' bao ngoài (v3 format)")

    w = deep_scan(root, "Width")
    h = deep_scan(root, "Height")
    l = deep_scan(root, "Length")

    blocks_tag = root.get("Blocks") if isinstance(root, dict) else deep_scan(root, "Blocks")

    if blocks_tag is not None and isinstance(blocks_tag, (dict, nbtlib.Compound)):
        palette   = blocks_tag.get("Palette")   or deep_scan(blocks_tag, "Palette")
        blockdata = blocks_tag.get("Data")       or deep_scan(blocks_tag, "Data")
        if blockdata is None:
            blockdata = blocks_tag.get("BlockData") or deep_scan(blocks_tag, "BlockData")
        if w and h and l and palette is not None and blockdata is not None:
            print("[INFO] Định dạng: SpongeSchematic v3")
            return palette, blockdata, int(w), int(h), int(l)

    if blocks_tag is not None and isinstance(blocks_tag, (list, nbtlib.List, bytes, bytearray)):
        print("[INFO] Định dạng: SpongeSchematic v1 (mảng số)")
        return None, blocks_tag, int(w) if w else 0, int(h) if h else 0, int(l) if l else 0

    print("[DEBUG] Không nhận dạng được định dạng. Dump cấu trúc NBT:")
    _dump_nbt_keys(nbt_file)

    for data_key in ("BlockData", "Data", "Blocks", "block_data", "blocks"):
        blockdata = deep_scan(nbt_file, data_key)
        if blockdata is not None:
            palette = deep_scan(nbt_file, "Palette") or deep_scan(nbt_file, "palette")
            if w and h and l:
                print(f"[INFO] Tìm thấy dữ liệu tại thẻ '{data_key}'")
                return palette, blockdata, int(w), int(h), int(l)

    raise ValueError(
        "Không thể tìm thấy dữ liệu block trong file .schem.\n"
        "File có thể bị hỏng hoặc dùng định dạng không được hỗ trợ."
    )


def parse_schem(file_path: str) -> tuple[list[BlockEntry], dict]:
    """Đọc file .schem (SpongeSchematic v1/v2/v3)."""
    print(f"[INFO] Đang đọc file .schem: {file_path}")
    nbt_file = nbtlib.load(file_path)

    palette_tag, block_data_tag, W, H, L = _extract_palette_and_data(nbt_file)

    if W == 0 or H == 0 or L == 0:
        raise ValueError(f"Kích thước không hợp lệ: W={W} H={H} L={L}")
    print(f"[INFO] Kích thước: {W} x {H} x {L}")

    if palette_tag is None:
        print("[INFO] Không có Palette → đọc dưới dạng ID số nguyên")
        raw = list(block_data_tag)
        blocks = []
        for idx, bid in enumerate(raw):
            if idx >= W * H * L:
                break
            bid = int(bid) & 0xFF
            if bid == 0:
                continue
            y = idx // (L * W)
            z = (idx % (L * W)) // W
            x = idx % W
            blocks.append(BlockEntry(x, y, z, DEFAULT_ID, 0))
        meta = {"width": W, "height": H, "length": L, "block_count": len(blocks)}
        print(f"[OK] Đọc {len(blocks)} khối (chế độ numeric)")
        return blocks, meta

    palette_lookup = {}
    for block_state_str, index in palette_tag.items():
        base_name, props = parse_block_state(block_state_str)
        mid = minecraft_name_to_miniworld_id(base_name)
        direction = get_direction(props)
        palette_lookup[int(index)] = (mid, direction)

    print(f"[INFO] Palette: {len(palette_lookup)} loại block")

    raw_bytes = None
    try:
        raw_bytes = bytes(block_data_tag)
    except Exception:
        raw_bytes = bytes([int(b) & 0xFF for b in block_data_tag])

    try:
        block_indices = decode_varint_array(raw_bytes)
        valid = sum(1 for v in block_indices if 0 <= v < len(palette_lookup) + 1)
        if valid < len(block_indices) * 0.5:
            raise ValueError("VarInt kết quả không hợp lý")
    except Exception as e:
        print(f"[CẢNH BÁO] Lỗi giải mã VarInt: {e} → thử raw bytes")
        block_indices = list(raw_bytes)

    expected = W * H * L
    actual = len(block_indices)
    if actual != expected:
        print(f"[CẢNH BÁO] Số block ({actual}) ≠ W×H×L ({expected})")

    blocks = []
    for idx, block_index in enumerate(block_indices):
        if idx >= expected:
            break
        y = idx // (L * W)
        z = (idx % (L * W)) // W
        x = idx % W
        entry = palette_lookup.get(block_index)
        if entry is None:
            mid, direction = DEFAULT_ID, 0
        else:
            mid, direction = entry
        if mid is None:
            continue
        blocks.append(BlockEntry(x, y, z, mid, direction))

    meta = {"width": W, "height": H, "length": L, "block_count": len(blocks)}
    print(f"[OK] Đã đọc {len(blocks)} khối từ .schem")
    return blocks, meta

def _decode_litematic_blocks(long_array: list, bits_per_block: int, total_blocks: int) -> list[int]:
    """Giải mã mảng LongArray của Litematica sang danh sách block-state index."""
    result  = []
    mask    = (1 << bits_per_block) - 1
    bit_buf = 0
    bit_len = 0

    for raw in long_array:
        val = raw & 0xFFFFFFFFFFFFFFFF
        bit_buf |= val << bit_len
        bit_len += 64
        while bit_len >= bits_per_block:
            if len(result) >= total_blocks:
                return result
            result.append(bit_buf & mask)
            bit_buf >>= bits_per_block
            bit_len  -= bits_per_block

    return result


def parse_litematic(file_path: str) -> tuple[list[BlockEntry], dict]:
    """Đọc file .litematic (Litematica mod – Minecraft Java Edition)."""
    print(f"[INFO] Đang đọc file .litematic: {file_path}")
    nbt_file = nbtlib.load(file_path)

    ver = deep_scan(nbt_file, "Version")
    print(f"[INFO] Litematic Version: {int(ver) if ver is not None else 'unknown'}")

    enc = deep_scan(nbt_file, "EnclosingSize")
    if enc and isinstance(enc, (dict, nbtlib.Compound)):
        print(f"[INFO] EnclosingSize: {enc.get('x',0)} x {enc.get('y',0)} x {enc.get('z',0)}")

    regions_tag = nbt_file.get("Regions") if "Regions" in nbt_file else deep_scan(nbt_file, "Regions")
    if not isinstance(regions_tag, (dict, nbtlib.Compound)):
        raise ValueError("Không tìm thấy thẻ Regions trong file .litematic")

    region_names = list(regions_tag.keys())
    print(f"[INFO] {len(region_names)} vùng: {region_names}")

    all_blocks: list[BlockEntry] = []

    for rname in region_names:
        region = regions_tag[rname]
        print(f"[INFO] Vùng '{rname}'")

        if not isinstance(region, (dict, nbtlib.Compound)):
            print("  [SKIP] không phải Compound")
            continue

        size_tag = region.get("Size") or deep_scan(region, "Size")
        if size_tag is None:
            print("  [SKIP] không có Size")
            continue

        sx = abs(int(size_tag.get("x", 0)))
        sy = abs(int(size_tag.get("y", 0)))
        sz = abs(int(size_tag.get("z", 0)))
        print(f"  Size abs=({sx},{sy},{sz})")

        if sx == 0 or sy == 0 or sz == 0:
            print("  [SKIP] kích thước = 0")
            continue

        palette_list = region.get("BlockStatePalette") or deep_scan(region, "BlockStatePalette")
        if palette_list is None:
            print("  [SKIP] không có BlockStatePalette")
            continue

        palette_lookup: dict[int, tuple] = {}
        for pidx, entry in enumerate(palette_list):
            if not isinstance(entry, (dict, nbtlib.Compound)):
                palette_lookup[pidx] = (DEFAULT_ID, 0)
                continue
            bname  = str(entry.get("Name", "minecraft:air"))
            ptag   = entry.get("Properties")
            props  = {}
            if ptag and isinstance(ptag, (dict, nbtlib.Compound)):
                props = {str(k): str(v) for k, v in ptag.items()}
            mid       = minecraft_name_to_miniworld_id(bname)
            direction = get_direction(props)
            palette_lookup[pidx] = (mid, direction)

        palette_size = len(palette_lookup)
        print(f"  Palette: {palette_size} loại block")

        bs_tag = region.get("BlockStates") or deep_scan(region, "BlockStates")
        if bs_tag is None:
            print("  [SKIP] không có BlockStates")
            continue

        total_blocks = sx * sy * sz
        bits_per_block = max(2, (palette_size - 1).bit_length()) if palette_size > 1 else 2

        try:
            long_list = [int(v) for v in bs_tag]
        except Exception as ex:
            print(f"  [ERR] đọc BlockStates: {ex}")
            continue

        n_longs = len(long_list)
        total_bits = n_longs * 64

        bits_ok = bits_per_block
        for try_bits in range(bits_per_block, 16):
            if (total_bits // try_bits) >= total_blocks:
                bits_ok = try_bits
                break
        if bits_ok != bits_per_block:
            print(f"  [AUTO] bits: {bits_per_block} → {bits_ok}")
        bits_per_block = bits_ok
        print(f"  bits_per_block={bits_per_block}, total_blocks={total_blocks}, longs={n_longs}")

        try:
            block_indices = _decode_litematic_blocks(long_list, bits_per_block, total_blocks)
        except Exception as ex:
            print(f"  [ERR] giải mã: {ex}")
            traceback.print_exc()
            continue

        actual = len(block_indices)
        if actual < total_blocks:
            print(f"  [WARN] chỉ giải mã {actual}/{total_blocks} block")

        region_count = 0
        for i, bidx in enumerate(block_indices):
            if i >= total_blocks:
                break
            lx = i % sx
            lz = (i // sx) % sz
            ly = i // (sx * sz)

            entry = palette_lookup.get(bidx)
            if entry is None:
                continue
            mid, direction = entry
            if mid is None:
                continue
            all_blocks.append(BlockEntry(lx, ly, lz, mid, direction))
            region_count += 1

        print(f"  → {region_count} khối hợp lệ")

    if not all_blocks:
        raise ValueError("Không đọc được khối nào từ file .litematic")

    min_x = min(b.x for b in all_blocks)
    min_y = min(b.y for b in all_blocks)
    min_z = min(b.z for b in all_blocks)
    for b in all_blocks:
        b.x -= min_x; b.y -= min_y; b.z -= min_z

    fw = max(b.x for b in all_blocks) + 1
    fh = max(b.y for b in all_blocks) + 1
    fl = max(b.z for b in all_blocks) + 1

    print(f"[OK] {len(all_blocks)} khối | kích thước cuối: {fw} x {fh} x {fl}")
    return all_blocks, {"width": fw, "height": fh, "length": fl,
                        "block_count": len(all_blocks), "regions": len(region_names)}
def parse_mcstructure(file_path: str) -> tuple[list[BlockEntry], dict]:
    """Đọc file .mcstructure (Minecraft Bedrock Edition) và xử lý mọi hướng block."""
    print(f"[INFO] Đang đọc file .mcstructure: {file_path}")
    
    try:
        nbt_file = nbtlib.load(file_path, byteorder="little")
    except Exception as e:
        print(f"[CẢNH BÁO] Đọc dạng Little Endian thất bại, thử Big Endian... ({e})")
        nbt_file = nbtlib.load(file_path)

    size_tag = nbt_file.get("size")
    if not size_tag:
        raise ValueError("Không tìm thấy thẻ 'size' trong .mcstructure")

    W, H, L = int(size_tag[0]), int(size_tag[1]), int(size_tag[2])
    print(f"[INFO] Kích thước (Bedrock): {W} x {H} x {L}")

    structure_tag = nbt_file.get("structure")
    if not structure_tag:
        raise ValueError("Không tìm thấy thẻ 'structure'")

    block_indices = structure_tag["block_indices"][0]
    block_palette = structure_tag["palette"]["default"]["block_palette"]

    palette_lookup = {}
    for idx, block_item in enumerate(block_palette):
        base_name = str(block_item.get("name", "minecraft:air"))
        states = block_item.get("states", {})
        props = {}

        # ─── BẮT ĐẦU FIX HƯỚNG BEDROCK SANG JAVA ───
        
        # 1. Cầu thang (Stairs) trong Bedrock dùng "weirdo_direction"
        if "weirdo_direction" in states:
            bedrock_weirdo = int(states["weirdo_direction"])
            # 0: East, 1: West, 2: South, 3: North
            weirdo_map = {0: "east", 1: "west", 2: "south", 3: "north"}
            props["facing"] = weirdo_map.get(bedrock_weirdo, "east")
            
        # 2. Block có hướng nói chung (Lò nung, Rương, Máy phân phát...)
        elif "facing_direction" in states:
            bedrock_facing = int(states["facing_direction"])
            facing_map = {0: "down", 1: "up", 2: "north", 3: "south", 4: "west", 5: "east"}
            props["facing"] = facing_map.get(bedrock_facing, "north")
            
        # 3. Cửa, Giường, Cửa sập (Doors, Trapdoors, Beds...)
        elif "direction" in states:
            bedrock_dir = int(states["direction"])
            dir_map = {0: "south", 1: "west", 2: "north", 3: "east"}
            props["facing"] = dir_map.get(bedrock_dir, "south")
            
        # 4. Đuốc (Torches)
        elif "torch_facing_direction" in states:
            t_facing = str(states["torch_facing_direction"])
            if t_facing == "top":
                props["facing"] = "up"
            elif t_facing != "unknown":
                props["facing"] = t_facing

        # 5. Gỗ, Cột thạch anh (Pillars / Logs)
        if "pillar_axis" in states:
            props["axis"] = str(states["pillar_axis"]).lower()
            
        # 6. Cầu thang úp ngược, Cửa sập mở, Phiến đá nửa trên
        if "upside_down_bit" in states and states["upside_down_bit"]:
            props["half"] = "top"
        if "top_slot_bit" in states and states["top_slot_bit"]:
            props["type"] = "top"

        # ─── KẾT THÚC FIX HƯỚNG ───

        # Tái sử dụng hàm chuyển đổi ID và tính Direction Mini World
        mid = minecraft_name_to_miniworld_id(base_name)
        direction = get_direction(props)
        palette_lookup[idx] = (mid, direction)

    print(f"[INFO] Palette: {len(palette_lookup)} loại block (Bedrock format)")

    blocks = []
    for x in range(W):
        for y in range(H):
            for z in range(L):
                # Công thức nội suy index 1 chiều của Bedrock
                index = (x * H * L) + (y * L) + z
                if index >= len(block_indices):
                    continue
                
                palette_idx = int(block_indices[index])
                if palette_idx < 0:
                    continue
                    
                entry = palette_lookup.get(palette_idx)
                if entry is None:
                    continue
                    
                mid, direction = entry
                if mid is None:
                    continue
                    
                blocks.append(BlockEntry(x, y, z, mid, direction))

    meta = {"width": W, "height": H, "length": L, "block_count": len(blocks)}
    print(f"[OK] Đã đọc {len(blocks)} khối từ .mcstructure")
    return blocks, meta
def parse_structure_nbt(file_path: str) -> tuple[list[BlockEntry], dict]:
    """Đọc file .nbt (Minecraft Java Structure format)."""
    print(f"[INFO] Đang đọc file structure .nbt: {file_path}")
    
    # Định dạng Java Structure dùng Big Endian (mặc định của nbtlib)
    nbt_file = nbtlib.load(file_path)

    # 1. Lấy kích thước
    size_tag = nbt_file.get("size")
    if not size_tag:
        raise ValueError("Không tìm thấy thẻ 'size' trong file .nbt")
    
    W, H, L = int(size_tag[0]), int(size_tag[1]), int(size_tag[2])
    print(f"[INFO] Kích thước (Java Structure): {W} x {H} x {L}")

    # 2. Trích xuất Palette
    # File .nbt có thể dùng thẻ 'palette' (1 danh sách) hoặc 'palettes' (nhiều danh sách)
    palette_tag = nbt_file.get("palette")
    if palette_tag is None and "palettes" in nbt_file:
        palette_tag = nbt_file["palettes"][0]
        
    if not palette_tag:
        raise ValueError("Không tìm thấy thẻ 'palette' hoặc 'palettes' trong tệp")

    palette_lookup = {}
    for idx, block_item in enumerate(palette_tag):
        base_name = str(block_item.get("Name", "minecraft:air"))
        props_tag = block_item.get("Properties")
        
        props = {}
        if props_tag and isinstance(props_tag, (dict, nbtlib.Compound)):
            props = {str(k): str(v) for k, v in props_tag.items()}
        
        # Vì đây là Java NBT, các properties (facing, axis...) đã chuẩn,
        # ta truyền thẳng vào hàm get_direction() hiện có
        mid = minecraft_name_to_miniworld_id(base_name)
        direction = get_direction(props)
        palette_lookup[idx] = (mid, direction)

    print(f"[INFO] Palette: {len(palette_lookup)} loại block (Java NBT format)")

    # 3. Đọc danh sách khối
    blocks_tag = nbt_file.get("blocks")
    if not blocks_tag:
        raise ValueError("Không tìm thấy thẻ 'blocks' trong tệp")

    blocks = []
    for block_node in blocks_tag:
        pos_tag = block_node.get("pos")
        state_idx = int(block_node.get("state", -1))

        if not pos_tag or state_idx < 0:
            continue

        x, y, z = int(pos_tag[0]), int(pos_tag[1]), int(pos_tag[2])
        
        entry = palette_lookup.get(state_idx)
        if entry is None:
            continue
            
        mid, direction = entry
        if mid is None: # Là khí (air) hoặc block vô hình
            continue
            
        blocks.append(BlockEntry(x, y, z, mid, direction))

    meta = {"width": W, "height": H, "length": L, "block_count": len(blocks)}
    print(f"[OK] Đã đọc {len(blocks)} khối từ structure .nbt")
    return blocks, meta

def generate_lua_script(blocks: list[BlockEntry], meta: dict, output_path: str):
    """
    Sinh file Lua từ danh sách BlockEntry.
    API Mini World: Block:setBlockAll(x, y, z, id, dir)
    """
    total = len(blocks)
    print(f"[INFO] Đang sinh Lua script cho {total} khối...")

    chunk = (total + 2) // 3
    part1 = blocks[:chunk]
    part2 = blocks[chunk:chunk*2]
    part3 = blocks[chunk*2:]

    def format_table(entries: list[BlockEntry], table_name: str) -> str:
        lines = [f"local {table_name} = {{"]
        for b in entries:
            lines.append(f"  {{{b.x},{b.y},{b.z},{b.miniworld_id},{b.direction}}},")
        lines.append("}")
        return "\n".join(lines)

    lua_header = (
        f"-- Mini World Building Script (Auto Generated)\n"
        f"-- Kich thuoc: {meta.get('width',0)} x {meta.get('height',0)} x {meta.get('length',0)}"
        f"  |  Tong khoi: {total}\n"
        f"-- Phan 1: {len(part1)} khoi | Phan 2: {len(part2)} khoi | Phan 3: {len(part3)} khoi\n"
        f"-- Huong dan: Click vao block bat ky de dat moc, sau do go /build\n\n"
    )

    lua_data1 = format_table(part1, "building_data_1")
    lua_data2 = format_table(part2, "building_data_2")
    lua_data3 = format_table(part3, "building_data_3")

    lua_logic = f"""
local originX, originY, originZ = nil, nil, nil

ScriptSupportEvent:registerEvent("Game.Start", function()
    Chat:sendSystemMsg("#Y#b==================================")
    Chat:sendSystemMsg("#Y#bHe thong san sang!")
    Chat:sendSystemMsg("#Y#bHay CLICK vao block bat ky de dat moc.")
    Chat:sendSystemMsg("#Y#bSau do go /build de xay dung.")
    Chat:sendSystemMsg("#Y#bTong so khoi: {total}")
    Chat:sendSystemMsg("#Y#b-- Made by Lao Ky --")
    Chat:sendSystemMsg("#Y#b==================================")
end)

ScriptSupportEvent:registerEvent("Player.ClickBlock", function(e)
    if originX == nil then
        originX, originY, originZ = e.x, e.y, e.z
        Block:setBlockAll(originX, originY, originZ, 1062, 0)
        Chat:sendSystemMsg("#BDa dat moc tai: " .. originX .. "," .. originY .. "," .. originZ)
        Chat:sendSystemMsg("#BGo lenh chat #R/build#B de khoi cong!")
    end
end)

ScriptSupportEvent:registerEvent("Player.NewInputContent", function(e)
    if e.content == "/build" then
        if originX == nil then
            Chat:sendSystemMsg("#R#bLoi: Ban chua chon vi tri moc!")
            return
        end
        Chat:sendSystemMsg("#bBat dau xay dung... ({total} khoi)")
        for i = 1, #building_data_1 do
            local d = building_data_1[i]
            Block:setBlockAll(originX + d[1], originY + d[2], originZ + d[3], d[4], d[5])
        end
        for i = 1, #building_data_2 do
            local d = building_data_2[i]
            Block:setBlockAll(originX + d[1], originY + d[2], originZ + d[3], d[4], d[5])
        end
        for i = 1, #building_data_3 do
            local d = building_data_3[i]
            Block:setBlockAll(originX + d[1], originY + d[2], originZ + d[3], d[4], d[5])
        end
        Chat:sendSystemMsg("#RHoan tat xay dung!")
    end
    if e.content == "/reset" then
        originX, originY, originZ = nil, nil, nil
        Chat:sendSystemMsg("#YDa reset moc. Hay click lai de chon vi tri moi.")
    end
end)
"""

    full_script = lua_header + lua_data1 + "\n\n" + lua_data2 + "\n\n" + lua_data3 + "\n" + lua_logic

    with open(output_path, "w", encoding="utf-8") as f:
        f.write(full_script)

    print(f"[OK] Da luu Lua script: {output_path}")
    print(f"     Kich thuoc file: {os.path.getsize(output_path) / 1024:.1f} KB")

def run_conversion(input_path: str, output_path: str = None):
    """Thực hiện chuyển đổi từ file đầu vào."""
    ext = Path(input_path).suffix.lower()

    if not os.path.exists(input_path):
        raise FileNotFoundError(f"Không tìm thấy file: {input_path}")

    try:
        if ext == ".schem":
            blocks, meta = parse_schem(input_path)
        elif ext in (".schematic", ".schm"):
            blocks, meta = parse_schematic(input_path)
        elif ext == ".litematic":
            blocks, meta = parse_litematic(input_path)
        elif ext == ".mcstructure":
            blocks, meta = parse_mcstructure(input_path)
        elif ext == ".nbt":                                 # <--- THÊM DÒNG NÀY
            blocks, meta = parse_structure_nbt(input_path)  # <--- THÊM DÒNG NÀY
        else:
            print(f"[CANH BAO] Phan mo rong khong ro '{ext}', thu tung parser...")
            parsed = False
            for parser_fn, label in [
                (parse_schem,     ".schem"),
                (parse_litematic, ".litematic"),
                (parse_schematic, ".schematic"),
                (parse_mcstructure,".mcstructure"),
                (parse_structure_nbt, ".nbt"),              # <--- THÊM VÀO FALLBACK
            ]:
                try:
                    blocks, meta = parser_fn(input_path)
                    print(f"[INFO] Doc thanh cong voi parser {label}")
                    parsed = True
                    break
                except Exception as ex:
                    print(f"[INFO] Parser {label} that bai: {ex}")
            if not parsed:
                raise ValueError("Khong the doc file voi bat ky parser nao.")

    except Exception as e:
        print(f"[LOI] Khong the doc file: {e}")
        traceback.print_exc()
        raise

    if not blocks:
        print("[CẢNH BÁO] Không có khối nào được đọc. Kiểm tra lại file đầu vào.")
        return None

    if output_path is None:
        stem = Path(input_path).stem
        output_dir = Path(input_path).parent
        output_path = str(output_dir / f"{stem}_miniworld.lua")

    generate_lua_script(blocks, meta, output_path)
    return output_path

                print(f"    [{int(v)}] {k}")
    except Exception as e:
        print(f"[LỖI] Không thể đọc file: {e}")
        traceback.print_exc()

# =========================================================================
# ⬆️⬆️ KẾT THÚC PHẦN DÁN CODE ⬆️⬆️
# =========================================================================

async def process_file(event):
    document.getElementById("log-output").value = "" # Xóa log cũ
    document.getElementById("download-link").style.display = "none"
    
    file_input = document.getElementById("file-upload")
    if file_input.files.length == 0:
        print("[LỖI] Bạn chưa chọn file nào!")
        return
        
    file = file_input.files.item(0)
    print(f"[INFO] Đã nạp file: {file.name}")
    print(f"[INFO] Đang chuyển dữ liệu vào hệ thống ảo...")

    try:
        # 1. Đọc dữ liệu nhị phân từ HTML DOM
        array_buffer = await file.arrayBuffer()
        file_bytes = Uint8Array.new(array_buffer).to_py()
        
        # 2. Ghi file vào hệ thống ảo của trình duyệt (Emscripten File System)
        # Bằng cách này, hàm nbtlib.load(file_path) gốc của bạn sẽ hoạt động hoàn hảo!
        virtual_input_path = file.name
        with open(virtual_input_path, "wb") as f:
            f.write(bytes(file_bytes))
            
        virtual_output_path = "output_script.lua"
        
        # 3. Kích hoạt logic chuyển đổi gốc của bạn
        print("-" * 50)
        result_path = run_conversion(virtual_input_path, virtual_output_path)
        print("-" * 50)
        
        if result_path:
            # 4. Đọc file Lua ảo và đẩy ngược ra trình duyệt để người dùng tải về
            with open(result_path, "r", encoding="utf-8") as f:
                lua_content = f.read()
            
            # Khởi tạo Blob JavaScript để tạo link tải xuống
            blob = Blob.new([lua_content], type="text/plain")
            url = URL.createObjectURL(blob)
            
            download_link = document.getElementById("download-link")
            download_link.href = url
            download_link.download = file.name.split('.')[0] + "_miniworld.lua"
            download_link.style.display = "inline-block"
            print(f"[THÀNH CÔNG] File Lua đã sẵn sàng! Nhấn nút tải xuống bên dưới.")
            
    except Exception as e:
        print(f"\\n[LỖI NGHIÊM TRỌNG] Quá trình thất bại:")
        traceback.print_exc()
    </script>
